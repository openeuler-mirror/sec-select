[workspace]
members = [
    "ratls-api",
    "ratls-sample",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
cose = { package = "cose-rust", version = "0.1" }
ciborium = "0.2.2"
coset = "0.4.0"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
openssl-sys = "0.9"
foreign-types-shared = "0.1"
